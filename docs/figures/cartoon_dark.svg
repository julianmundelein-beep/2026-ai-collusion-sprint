    <circle cx="10" cy="224" r="3.5" fill="#e6edf3"/>
    <path d="M-9 240 h18" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/>
    <use href="#glass" transform="translate(-58,236) rotate(-20)"/>
  </g>
</g>
</svg>
